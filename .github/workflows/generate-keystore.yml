name: Generate Android Signing Keystore

on:
  workflow_dispatch:
    inputs:
      confirm_generation:
        description: "Confirm this is the first and only keystore generation for this app"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

jobs:
  generate-keystore:
    if: inputs.confirm_generation == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate signing keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p keystore-output

          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$STORE_PASSWORD"

          keytool -genkeypair \
            -v \
            -keystore keystore-output/audiopulse-release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias audiopulse \
            -dname "CN=AudioPulse, OU=Android, O=AudioPulse, L=Unknown, ST=Unknown, C=IN" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD"

          base64 -w 0 keystore-output/audiopulse-release.jks > keystore-output/keystore-base64.txt

          cat > keystore-output/keystore-info.txt <<EOF
          Keystore file: audiopulse-release.jks
          Key alias: audiopulse
          Store password: $STORE_PASSWORD
          Key password: $KEY_PASSWORD

          IMPORTANT:
          - Keep this information private and backed up securely.
          - Do not generate another keystore for the same app.
          - Save the Base64 text as the GitHub Actions secret KEYSTORE_BASE64.
          - Save the other values as KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD.
          EOF

      - name: Upload keystore package
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore-output/*.txt
          if-no-files-found: error
          retention-days: 7
